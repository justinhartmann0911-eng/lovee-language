<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>svenja</title>


<style>

/* =========================================
   GRUNDLAYOUT
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6
        );
}

.app {

    width: 100%;

    text-align: center;
}


/* =========================================
   HAUPT-TEDDY
   ========================================= */

.teddy {

    width: 300px;

    max-width: 80vw;

    border-radius: 25px;

    display: block;

    margin:
        0 auto 20px;
}


/* =========================================
   TITEL
   ========================================= */

h1 {

    color: #d6336c;

    font-size: 32px;

    margin:
        10px 0 30px;

    transition:
        opacity 0.5s ease,
        height 0.5s ease,
        margin 0.5s ease;
}

h1.hide {

    opacity: 0;

    height: 0;

    margin: 0;

    overflow: hidden;
}


/* =========================================
   HERZ-BUTTON
   ========================================= */

.heart {

    border: none;

    background: transparent;

    padding: 0;

    margin: 0 auto;

    cursor: pointer;

    display: block;

    position: relative;

    z-index: 10;

    -webkit-tap-highlight-color:
        transparent;

    touch-action: manipulation;
}


.heart img {

    width: 120px;

    height: auto;

    display: block;

    transition:
        transform 0.2s ease;
}


.heart:active img {

    transform:
        scale(1.4);
}


/* =========================================
   NACHRICHT
   ========================================= */

#message {

    margin-top: 25px;

    font-size: 30px;

    font-weight: bold;

    color: #d6336c;

    opacity: 0;

    transform:
        scale(0.5);

    transition:
        0.5s;

    padding:
        0 20px;
}


#message.show {

    opacity: 1;

    transform:
        scale(1);
}


/* =========================================
   SPIEL START BUTTON
   ========================================= */

#startGameButton {

    display: none;

    margin:
        25px auto 0;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding:
        14px 28px;

    border-radius: 30px;

    cursor: pointer;

    position: relative;

    z-index: 20;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}


#startGameButton:active {

    transform:
        scale(0.94);
}


/* =========================================
   FLIEGENDE HERZEN
   ========================================= */

@keyframes fly {

    from {

        top: 55%;

        opacity: 1;

        transform:
            translateX(0)
            scale(0.5);
    }

    to {

        top: -20%;

        opacity: 0;

        transform:
            translateX(var(--moveX))
            scale(1);
    }

}


.floating-heart {

    position: fixed;

    width: 20px;

    height: 20px;

    animation:
        fly 4s linear forwards;

    pointer-events: none;

    z-index: 100;
}


.floating-heart img {

    width: 20px;

    height: 20px;

    display: block;
}


/* =========================================
   SPIEL
   ========================================= */

#game {

    display: none;

    width: 100%;

    text-align: center;
}


#gameTitle {

    color: #d6336c;

    font-size: 30px;

    margin:
        0 0 8px;
}


#gameText {

    color: #a61e4d;

    font-size: 17px;

    line-height: 1.4;

    margin:
        0 0 12px;
}


/* =========================================
   SPIELFELD
   ========================================= */

#gameArea {

    position: relative;

    width:
        min(900px, 94vw);

    height: 300px;

    margin:
        0 auto;

    overflow: hidden;

    border-radius: 20px;

    border:
        4px solid #d6336c;

    background-image:
        url("hintergrund.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    box-shadow:
        0 10px 30px
        rgba(
            214,
            51,
            108,
            0.2
        );
}


/* =========================================
   BODEN
   ========================================= */

#ground {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 8px;

    background: #d6336c;

    z-index: 3;
}


/* =========================================
   PIXEL TEDDY
   ========================================= */

#player {

    position: absolute;

    left: 80px;

    bottom: 8px;

    width: 65px;

    height: 65px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 5;

    pointer-events: none;

    user-select: none;
}


/* =========================================
   SPRUNG
   ========================================= */

#player.jump {

    animation:
        jump 0.65s ease-out;
}


@keyframes jump {

    0% {

        bottom: 8px;
    }

    50% {

        bottom: 150px;
    }

    100% {

        bottom: 8px;
    }

}


/* =========================================
   HERZ-HINDERNISSE
   ========================================= */

.obstacle {

    position: absolute;

    right: -70px;

    bottom: 8px;

    width: 55px;

    height: 55px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 4;

    pointer-events: none;

    animation:
        obstacleMove
        2.2s
        linear
        forwards;
}


@keyframes obstacleMove {

    from {

        right: -70px;
    }

    to {

        right: 100%;
    }

}


/* =========================================
   SPRUNG-TASTE
   ========================================= */

#jumpButton {

    display: block;

    width:
        min(300px, 80vw);

    margin:
        12px auto 0;

    padding:
        15px 25px;

    border: none;

    border-radius: 30px;

    background: #d6336c;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(
            214,
            51,
            108,
            0.25
        );

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;

    user-select: none;
}


#jumpButton:active {

    transform:
        scale(0.94);

    background:
        #c2255c;
}


/* =========================================
   PUNKTE
   ========================================= */

#score {

    margin-top: 10px;

    color: #d6336c;

    font-size: 20px;

    font-weight: bold;
}


/* =========================================
   GAME OVER
   ========================================= */

#gameOver {

    display: none;

    position: absolute;

    inset: 0;

    background:
        rgba(
            255,
            240,
            246,
            0.95
        );

    z-index: 20;

    justify-content: center;

    align-items: center;

    flex-direction: column;
}


#gameOver h2 {

    color: #d6336c;

    font-size: 34px;

    margin: 5px;
}


#gameOver p {

    color: #a61e4d;

    font-size: 19px;

    margin: 5px;
}


/* =========================================
   NOCHMAL SPIELEN
   ========================================= */

#restart {

    margin-top: 15px;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 18px;

    font-weight: bold;

    padding:
        13px 25px;

    border-radius: 30px;

    cursor: pointer;

    z-index: 30;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}


#restart:active {

    transform:
        scale(0.95);
}


/* =========================================
   HANDY
   ========================================= */

@media (max-width: 600px) {

    .app {

        position: relative;

        top: -20px;
    }


    .teddy {

        width: 260px;

        margin-bottom: 15px;
    }


    h1 {

        font-size: 25px;

        margin:
            10px 25px 25px;
    }


    .heart img {

        width: 100px;
    }


    #message {

        margin-top: 10px;

        font-size: 24px;

        padding:
            0 20px;
    }


    #startGameButton {

        font-size: 18px;

        padding:
            14px 25px;

        min-height: 50px;
    }


    #gameTitle {

        font-size: 24px;
    }


    #gameText {

        font-size: 14px;
    }


    #gameArea {

        width: 94vw;

        height: 230px;
    }


    #player {

        left: 35px;

        width: 55px;

        height: 55px;
    }


    .obstacle {

        width: 48px;

        height: 48px;
    }


    #jumpButton {

        width: 80vw;

        max-width: 320px;

        min-height: 55px;

        font-size: 21px;

        margin-top: 10px;
    }


    #score {

        font-size: 18px;

        margin-top: 8px;
    }


    #gameOver h2 {

        font-size: 28px;
    }


    #gameOver p {

        font-size: 16px;
    }


    #restart {

        min-height: 50px;

        padding:
            13px 24px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================
         HAUPT TEDDY
         ===================================== -->

    <img
        src="teddy_sonnenblume.png"
        class="teddy"
        id="mainTeddy"
        alt="Teddy"
    >


    <!-- =====================================
         TITEL
         ===================================== -->

    <h1 id="title">

        ich bin dein drück mich teddy,
        wenn justin wieder doof ist.

    </h1>


    <!-- =====================================
         HERZ
         ===================================== -->

    <button
        class="heart"
        id="heartButton"
        type="button"
    >

        <img
            src="herz.png"
            alt="Herz"
        >

    </button>


    <!-- =====================================
         NACHRICHT
         ===================================== -->

    <div id="message"></div>


    <!-- =====================================
         SPIEL START BUTTON
         ===================================== -->

    <button
        id="startGameButton"
        type="button"
    >

        🎮 Spiel starten ❤️

    </button>


    <!-- =====================================
         SPIEL
         ===================================== -->

    <div id="game">


        <div id="gameTitle">

            🧸 Kleines Herzchen-Jump 💕

        </div>


        <div id="gameText">

            Springe über die Herzchen!

            <br>

            Handy: SPRINGEN-Taste

            ·

            PC: Leertaste / Pfeil hoch

        </div>


        <!-- =================================
             SPIELFELD
             ================================= -->

        <div id="gameArea">


            <img
                src="teddy.png"
                id="player"
                alt="Pixel Teddy"
            >


            <div id="ground"></div>


            <!-- GAME OVER -->

            <div id="gameOver">


                <h2>

                    Oh nein! 💔

                </h2>


                <p>

                    Der Teddy ist gegen
                    ein Herz gelaufen!

                </p>


                <p id="finalScore"></p>


                <button
                    id="restart"
                    type="button"
                >

                    nochmal spielen ❤️

                </button>


            </div>


        </div>


        <!-- =================================
             SPRUNG BUTTON
             ================================= -->

        <button
            id="jumpButton"
            type="button"
        >

            🧸 SPRINGEN ❤️

        </button>


        <!-- =================================
             PUNKTE
             ================================= -->

        <div id="score">

            Herzen übersprungen: 0

        </div>


    </div>

</div>



<script>

/* =========================================
   ÜBERRASCHUNGEN
   ========================================= */

const surprises = [

    {
        image: "teddy_sonnenblume.png",

        text:
        "denk dran dieser bubi liebt dich, egal wie doof er ist. 💕"
    },


    {
        image: "teddy_herz.png",

        text:
        "Justin denkt an dich.❤️"
    },


    {
        image: "teddy_liebe.png",

        text:
        "ich liebe diese blauen augen und die wundervolle doofe art❤️"
    },


    {
        image: "teddy_kuss.png",

        text:
        "Ich bin so froh, dass es dich gibt ❤️"
    },


    {
        image: "teddy_blumen.png",

        text:
        "du bist der trottel den ich braucheee💗"
    },


    {
        image: "teddy_rot.png",

        text:
        "Mit dir ist alles schöner 💞"
    },


    {
        image: "teddy_herz2.png",

        text:
        "Du bist mein safeplace ❤️"
    },


    {
        image: "teddy_liebe2.png",

        text:
        "ich will dich niemals verlieren💕"
    }

];


/*
Wichtig:

0 = erste Überraschung
1 = zweite Überraschung
...
7 = letzte Überraschung

Nach dem 8. Klick erscheint
der Spiel-Startbutton.
*/

let surpriseIndex = 0;


/* =========================================
   ELEMENTE
   ========================================= */

const title =
    document.getElementById(
        "title"
    );

const mainTeddy =
    document.getElementById(
        "mainTeddy"
    );

const heartButton =
    document.getElementById(
        "heartButton"
    );

const message =
    document.getElementById(
        "message"
    );

const startGameButton =
    document.getElementById(
        "startGameButton"
    );

const game =
    document.getElementById(
        "game"
    );

const gameArea =
    document.getElementById(
        "gameArea"
    );

const player =
    document.getElementById(
        "player"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const restart =
    document.getElementById(
        "restart"
    );

const jumpButton =
    document.getElementById(
        "jumpButton"
    );


/* =========================================
   HERZ KLICK
   ========================================= */

function love() {

    /*
    Titel beim ersten Klick
    verschwinden lassen.
    */

    title.classList.add(
        "hide"
    );


    /*
    AKTUELLEN Teddy anzeigen.
    */

    mainTeddy.src =
        surprises[
            surpriseIndex
        ].image;


    /*
    Nachricht neu anzeigen.
    */

    message.classList.remove(
        "show"
    );


    setTimeout(() => {

        message.innerHTML =
            surprises[
                surpriseIndex
            ].text;

        message.classList.add(
            "show"
        );

    }, 100);


    /*
    Fliegende Herzen.
    */

    createFlyingHearts();


    /*
    Prüfen, ob DAS die
    letzte Überraschung ist.

    Wichtig:
    Die Variable wird VOR dem
    Hochzählen geprüft.
    */

    const lastSurprise =
        surpriseIndex ===
        surprises.length - 1;


    /*
    Erst danach zum nächsten
    Eintrag wechseln.
    */

    surpriseIndex++;


    /*
    Nach der letzten Überraschung
    wieder bei 0 anfangen.

    Der Spielbutton bleibt aber
    sichtbar.
    */

    if (
        surpriseIndex >=
        surprises.length
    ) {

        surpriseIndex = 0;

    }


    /*
    NUR nach der letzten
    Überraschung den Spielbutton
    anzeigen.

    Das Herz bleibt dabei
    weiterhin funktionsfähig.
    */

    if (
        lastSurprise
    ) {

        startGameButton.style.display =
            "block";

    }

}


/* =========================================
   HERZ BUTTON
   ========================================= */

heartButton.addEventListener(
    "click",
    love
);


/* =========================================
   FLIEGENDE HERZEN
   ========================================= */

function createFlyingHearts() {


    for (
        let i = 0;
        i < 12;
        i++
    ) {


        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "floating-heart";


        const img =
            document.createElement(
                "img"
            );


        img.src =
            "herz.png";


        heart.appendChild(
            img
        );


        heart.style.left =
            (
                40 +
                Math.random() * 20
            ) + "vw";


        heart.style.top =
            (
                45 +
                Math.random() * 20
            ) + "vh";


        heart.style.setProperty(

            "--moveX",

            (
                Math.random() * 700 -
                350
            ) + "px"

        );


        document.body.appendChild(
            heart
        );


        setTimeout(() => {

            heart.remove();

        }, 4000);

    }

}


/* =========================================
   SPIEL VARIABLEN
   ========================================= */

let gameRunning = false;

let jumpCount = 0;

let score = 0;

let gameTimer = null;

let collisionTimer = null;

let obstacleSpeed = 2.2;


/* =========================================
   SPIEL STARTEN
   ========================================= */

function startGame() {


    /*
    Hauptbereich verstecken.
    */

    mainTeddy.style.display =
        "none";

    title.style.display =
        "none";

    heartButton.style.display =
        "none";

    message.style.display =
        "none";

    startGameButton.style.display =
        "none";


    /*
    Spiel anzeigen.
    */

    game.style.display =
        "block";


    /*
    Werte zurücksetzen.
    */

    gameRunning = true;

    score = 0;

    jumpCount = 0;

    obstacleSpeed = 2.2;


    /*
    Game Over verstecken.
    */

    gameOver.style.display =
        "none";


    /*
    Alte Herzen löschen.
    */

    document
        .querySelectorAll(
            ".obstacle"
        )
        .forEach(
            obstacle =>
                obstacle.remove()
        );


    updateScore();


    /*
    Erstes Hindernis.
    */

    createObstacle();


    /*
    Kollision prüfen.
    */

    collisionTimer =
        setInterval(
            checkCollision,
            30
        );

}


startGameButton.addEventListener(
    "click",
    startGame
);


/* =========================================
   SPRUNG
   ========================================= */

function jump() {


    if (
        !gameRunning
    ) {

        return;

    }


    /*
    Maximal zwei Sprünge.
    */

    if (
        jumpCount >= 2
    ) {

        return;

    }


    jumpCount++;


    /*
    Animation zurücksetzen.
    */

    player.classList.remove(
        "jump"
    );


    void player.offsetWidth;


    /*
    Neuen Sprung starten.
    */

    player.classList.add(
        "jump"
    );


    /*
    Nach dem Sprung wieder
    beide Sprünge freigeben.

    Dadurch kann man erneut
    einen Doppelsprung machen.
    */

    setTimeout(() => {

        jumpCount = 0;

    }, 650);

}


/* =========================================
   SPRUNG-TASTE
   ========================================= */

jumpButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        jump();

    }
);


/* =========================================
   HERZEN ERZEUGEN
   ========================================= */

function createObstacle() {


    if (
        !gameRunning
    ) {

        return;

    }


    const obstacle =
        document.createElement(
            "img"
        );


    obstacle.src =
        "herzspiel.png";


    obstacle.className =
        "obstacle";


    obstacle.style.animationDuration =
        obstacleSpeed + "s";


    gameArea.appendChild(
        obstacle
    );


    /*
    Wenn das Herz rechts
    aus dem Bildschirm fliegt:
    Punkt bekommen.
    */

    obstacle.addEventListener(
        "animationend",
        function() {


            if (
                obstacle.parentElement
            ) {

                obstacle.remove();


                if (
                    gameRunning
                ) {

                    score++;

                    updateScore();

                }

            }

        }
    );


    /*
    Herzen werden schneller.
    */

    obstacleSpeed -= 0.08;


    /*
    Maximale Geschwindigkeit.
    */

    if (
        obstacleSpeed < 0.75
    ) {

        obstacleSpeed = 0.75;

    }


    /*
    Abstand zwischen den Herzen
    wird ebenfalls kleiner.
    */

    const nextTime =
        Math.max(
            550,
            1500 -
            score * 25
        );


    gameTimer =
        setTimeout(
            createObstacle,
            nextTime
        );

}


/* =========================================
   KOLLISION
   ========================================= */

function checkCollision() {


    if (
        !gameRunning
    ) {

        return;

    }


    const playerRect =
        player.getBoundingClientRect();


    const obstacles =
        document.querySelectorAll(
            ".obstacle"
        );


    obstacles.forEach(
        function(obstacle) {


            const obstacleRect =
                obstacle.getBoundingClientRect();


            const padding = 10;


            const collision =

                playerRect.left +
                padding <
                obstacleRect.right &&

                playerRect.right -
                padding >
                obstacleRect.left &&

                playerRect.top +
                padding <
                obstacleRect.bottom &&

                playerRect.bottom -
                padding >
                obstacleRect.top;


            if (
                collision
            ) {

                gameOverFunction();

            }

        }
    );

}


/* =========================================
   PUNKTE
   ========================================= */

function updateScore() {

    document
        .getElementById(
            "score"
        )
        .innerHTML =

        "Herzen übersprungen: " +
        score;

}


/* =========================================
   GAME OVER
   ========================================= */

function gameOverFunction() {


    if (
        !gameRunning
    ) {

        return;

    }


    gameRunning = false;


    clearTimeout(
        gameTimer
    );


    clearInterval(
        collisionTimer
    );


    document
        .getElementById(
            "finalScore"
        )
        .innerHTML =

        "Du hast " +
        score +
        " Herzchen geschafft! 💕";


    gameOver.style.display =
        "flex";

}


/* =========================================
   NOCHMAL SPIELEN
   ========================================= */

function restartGame() {


    /*
    ALLE Timer stoppen.
    */

    clearTimeout(
        gameTimer
    );

    clearInterval(
        collisionTimer
    );


    /*
    Alte Hindernisse löschen.
    */

    document
        .querySelectorAll(
            ".obstacle"
        )
        .forEach(
            obstacle =>
                obstacle.remove()
        );


    /*
    Werte komplett zurücksetzen.
    */

    score = 0;

    jumpCount = 0;

    obstacleSpeed = 2.2;


    updateScore();


    /*
    Game Over schließen.
    */

    gameOver.style.display =
        "none";


    /*
    Spiel wieder aktivieren.
    */

    gameRunning = true;


    /*
    Neues Herz starten.
    */

    createObstacle();


    /*
    Kollisionsprüfung neu starten.
    */

    collisionTimer =
        setInterval(
            checkCollision,
            30
        );

}


/* =========================================
   RESTART BUTTON
   ========================================= */

restart.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        event.stopPropagation();

        restartGame();

    }
);


/* =========================================
   PC TASTATUR

document.addEventListener(
    "keydown",
    function(event) {


        if (
            !gameRunning
        ) {

            return;

        }


        if (

            event.code ===
            "Space"

            ||

            event.code ===
            "ArrowUp"

        ) {

            event.preventDefault();

            jump();

        }

    }
);

</script>
