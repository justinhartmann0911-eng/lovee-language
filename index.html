<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>svenja</title>


<style>

/* =========================================
   GRUNDLAYOUT
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;
}

body {

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6
        );
}


.app {

    width: 100%;

    text-align: center;
}


/* =========================================
   HAUPT-TEDDY
   ========================================= */

.teddy {

    width: 300px;

    max-width: 80vw;

    border-radius: 25px;

    display: block;

    margin:
        0 auto 20px;
}


/* =========================================
   START-TEXT
   ========================================= */

h1 {

    color: #d6336c;

    font-size: 32px;

    margin:
        10px 0 30px;

    transition:
        opacity 0.5s ease,
        height 0.5s ease,
        margin 0.5s ease;
}


h1.hide {

    opacity: 0;

    height: 0;

    margin: 0;

    overflow: hidden;
}


/* =========================================
   HERZ-BUTTON
   ========================================= */

.heart {

    border: none;

    background: transparent;

    cursor: pointer;

    padding: 0;

    -webkit-tap-highlight-color:
        transparent;
}


.heart img {

    width: 120px;

    height: auto;

    display: block;

    transition:
        transform 0.3s ease;
}


.heart:active img {

    transform:
        scale(1.5);
}


/* =========================================
   NACHRICHT
   ========================================= */

#message {

    margin-top: 25px;

    font-size: 30px;

    font-weight: bold;

    color: #d6336c;

    opacity: 0;

    transform:
        scale(0.5);

    transition:
        0.5s;

    padding:
        0 20px;
}


#message.show {

    opacity: 1;

    transform:
        scale(1);
}


/* =========================================
   SPIEL-START BUTTON
   ========================================= */

#startGameButton {

    display: none;

    margin:
        25px auto 0;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding:
        14px 28px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(
            214,
            51,
            108,
            0.25
        );

    position: relative;

    z-index: 50;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}


#startGameButton:active {

    transform:
        scale(0.94);
}


/* =========================================
   FLIEGENDE HERZEN
   ========================================= */

@keyframes fly {

    from {

        top: 55%;

        opacity: 1;

        transform:
            translateX(0)
            scale(0.5);
    }

    to {

        top: -20%;

        opacity: 0;

        transform:
            translateX(var(--moveX))
            scale(1);
    }

}


.floating-heart {

    position: fixed;

    left: 50%;

    top: 55%;

    width: 20px;

    height: 20px;

    animation:
        fly 4s linear forwards;

    pointer-events: none;

    z-index: 100;
}


.floating-heart img {

    width: 20px;

    height: 20px;

    display: block;
}


/* =========================================
   JUMP-SPIEL
   ========================================= */

#game {

    display: none;

    width: 100%;

    text-align: center;
}


#gameTitle {

    color: #d6336c;

    font-size: 30px;

    margin:
        0 0 10px;
}


#gameText {

    color: #a61e4d;

    font-size: 18px;

    line-height: 1.4;

    margin:
        0 0 15px;
}


/* =========================================
   SPIELFELD
   ========================================= */

#gameArea {

    position: relative;

    width:
        min(900px, 94vw);

    height: 300px;

    margin: auto;

    overflow: hidden;

    border-radius: 20px;

    border:
        4px solid #d6336c;

    background-image:
        url("hintergrund.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    box-shadow:
        0 10px 30px
        rgba(
            214,
            51,
            108,
            0.2
        );

    /*
    Das gesamte Spielfeld ist
    auf dem Handy antippbar.
    */

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-tap-highlight-color:
        transparent;
}


/* =========================================
   BODEN
   ========================================= */

#ground {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 8px;

    background: #d6336c;

    z-index: 3;

    pointer-events: none;
}


/* =========================================
   PIXEL-TEDDY
   ========================================= */

#player {

    position: absolute;

    left: 80px;

    bottom: 8px;

    width: 65px;

    height: 65px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 5;

    user-select: none;

    pointer-events: none;

    -webkit-user-drag: none;
}


/* =========================================
   SPRUNG
   ========================================= */

#player.jump {

    animation:
        jump 0.65s ease-out;
}


@keyframes jump {

    0% {

        bottom: 8px;
    }

    50% {

        bottom: 150px;
    }

    100% {

        bottom: 8px;
    }

}


/* =========================================
   HERZ-HINDERNISSE
   ========================================= */

.obstacle {

    position: absolute;

    right: -70px;

    bottom: 8px;

    width: 55px;

    height: 55px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 4;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;

    animation:
        obstacleMove
        2.2s
        linear
        forwards;
}


@keyframes obstacleMove {

    from {

        right: -70px;
    }

    to {

        right: 100%;
    }

}


/* =========================================
   PUNKTE
   ========================================= */

#score {

    margin-top: 12px;

    color: #d6336c;

    font-size: 22px;

    font-weight: bold;
}


/* =========================================
   GAME OVER
   ========================================= */

#gameOver {

    display: none;

    position: absolute;

    inset: 0;

    background:
        rgba(
            255,
            240,
            246,
            0.94
        );

    z-index: 20;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    /*
    Wichtig:
    Der Bereich kann normal
    angeklickt werden.
    */

    touch-action: auto;
}


#gameOver h2 {

    color: #d6336c;

    font-size: 34px;

    margin: 5px;
}


#gameOver p {

    color: #a61e4d;

    font-size: 20px;

    margin: 5px;
}


/* =========================================
   NOCHMAL SPIELEN
   ========================================= */

#restart {

    margin-top: 15px;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 18px;

    font-weight: bold;

    padding:
        12px 25px;

    border-radius: 30px;

    cursor: pointer;

    position: relative;

    z-index: 30;

    touch-action: manipulation;

    -webkit-tap-highlight-color:
        transparent;
}


#restart:active {

    transform:
        scale(0.95);
}


/* =========================================
   HANDY
   ========================================= */

@media (max-width: 600px) {

    .app {

        position: relative;

        top: -30px;
    }


    .teddy {

        width: 260px;

        margin-bottom: 15px;
    }


    h1 {

        font-size: 25px;

        margin:
            10px 25px 25px;
    }


    .heart img {

        width: 100px;
    }


    #message {

        margin-top: 10px;

        font-size: 24px;

        padding:
            0 20px;
    }


    #startGameButton {

        font-size: 18px;

        padding:
            13px 25px;

        margin-top: 20px;

        min-height: 50px;
    }


    #game {

        position: relative;

        top: 0;
    }


    #gameTitle {

        font-size: 25px;

        margin-bottom: 5px;
    }


    #gameText {

        font-size: 15px;

        margin-bottom: 10px;
    }


    #gameArea {

        height: 240px;

        width: 94vw;

        /*
        Große Touch-Fläche
        */

        min-height: 220px;
    }


    #player {

        left: 40px;

        width: 55px;

        height: 55px;
    }


    .obstacle {

        width: 48px;

        height: 48px;
    }


    #gameOver h2 {

        font-size: 29px;
    }


    #gameOver p {

        font-size: 17px;
    }


    #restart {

        font-size: 17px;

        padding:
            13px 23px;

        min-height: 48px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================
         HAUPT-TEDDY
         ===================================== -->

    <img
        src="teddy_sonnenblume.png"
        class="teddy"
        id="mainTeddy"
        alt="Teddy"
    >


    <!-- =====================================
         START-TEXT
         ===================================== -->

    <h1 id="title">

        ich bin dein drück mich teddy,

    </h1>


    <!-- =====================================
         HERZ-BUTTON
         ===================================== -->

    <button
        class="heart"
        id="heartButton"
        type="button"
    >

        <img
            src="herz.png"

    <!-- =====================================

    <div id="message"></div>


    <!-- =====================================

         ===================================== -->

    <button
        id="startGameButton"

    <!-- =====================================

    <div id="game">

        <div id="gameText">

            Spring über die Herzchen!

        <!-- SPIELFELD -->
