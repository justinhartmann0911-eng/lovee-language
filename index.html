<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>svenja</title>


<style>

/* =========================================
   GRUNDLAYOUT
   ========================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6
        );
}


.app {

    text-align: center;

    width: 100%;
}


/* =========================================
   TEDDY
   ========================================= */

.teddy {

    width: 300px;

    max-width: 80vw;

    border-radius: 25px;

    display: block;

    margin:
        0 auto 20px;
}


/* =========================================
   START-TEXT
   ========================================= */

h1 {

    color: #d6336c;

    font-size: 32px;

    margin:
        10px 0 30px;

    transition:
        opacity 0.5s ease,
        height 0.5s ease,
        margin 0.5s ease;
}


h1.hide {

    opacity: 0;

    height: 0;

    margin: 0;

    overflow: hidden;
}


/* =========================================
   HERZ-BUTTON
   ========================================= */

.heart {

    border: none;

    background: transparent;

    cursor: pointer;

    padding: 0;
}


.heart img {

    width: 120px;

    height: auto;

    display: block;

    transition:
        transform 0.3s ease;
}


.heart:active img {

    transform:
        scale(1.5);
}


/* =========================================
   NACHRICHT
   ========================================= */

#message {

    margin-top: 25px;

    font-size: 30px;

    font-weight: bold;

    color: #d6336c;

    opacity: 0;

    transform:
        scale(0.5);

    transition:
        0.5s;

    padding:
        0 20px;
}


#message.show {

    opacity: 1;

    transform:
        scale(1);
}


/* =========================================
   SPIEL STARTEN BUTTON
   ========================================= */

#startGameButton {

    display: none;

    margin:
        25px auto 0;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding:
        14px 28px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(
            214,
            51,
            108,
            0.25
        );

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.15s ease,
        background 0.2s ease;
}


#startGameButton:active {

    transform:
        scale(0.94);
}


#startGameButton:hover {

    background: #c2255c;
}


/* =========================================
   FLIEGENDE HERZEN
   ========================================= */

@keyframes fly {

    from {

        top: 55%;

        opacity: 1;

        transform:
            translateX(0)
            scale(0.5);
    }

    to {

        top: -20%;

        opacity: 0;

        transform:
            translateX(var(--moveX))
            scale(1);
    }

}


.floating-heart {

    position: fixed;

    left: 50%;

    top: 55%;

    width: 20px;

    height: 20px;

    animation:
        fly 4s linear forwards;

    pointer-events: none;

    z-index: 100;
}


.floating-heart img {

    width: 20px;

    height: 20px;

    display: block;
}


/* =========================================
   JUMP-SPIEL
   ========================================= */

#game {

    display: none;

    width: 100%;

    text-align: center;
}


/* =========================================
   SPIEL-TITEL
   ========================================= */

#gameTitle {

    color: #d6336c;

    font-size: 30px;

    margin:
        0 0 10px;
}


#gameText {

    color: #a61e4d;

    font-size: 18px;

    line-height: 1.4;

    margin:
        0 0 15px;
}


/* =========================================
   SPIELFELD
   ========================================= */

#gameArea {

    position: relative;

    width:
        min(900px, 94vw);

    height: 300px;

    margin: auto;

    overflow: hidden;

    border-radius: 20px;

    border:
        4px solid #d6336c;

    background-image:
        url("hintergrund.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    box-shadow:
        0 10px 30px
        rgba(
            214,
            51,
            108,
            0.2
        );

    touch-action: manipulation;
}


/* =========================================
   BODEN
   ========================================= */

#ground {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 8px;

    background: #d6336c;

    z-index: 3;
}


/* =========================================
   PIXEL-TEDDY
   ========================================= */

#player {

    position: absolute;

    left: 80px;

    bottom: 8px;

    width: 65px;

    height: 65px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 5;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================
   TEDDY SPRUNG
   ========================================= */

#player.jump {

    animation:
        jump 0.65s ease-out;
}


@keyframes jump {

    0% {

        bottom: 8px;
    }

    50% {

        bottom: 150px;
    }

    100% {

        bottom: 8px;
    }

}


/* =========================================
   HERZ-HINDERNIS
   ========================================= */

.obstacle {

    position: absolute;

    right: -70px;

    bottom: 8px;

    width: 55px;

    height: 55px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 4;

    user-select: none;

    -webkit-user-drag: none;

    animation:
        obstacleMove
        2.2s
        linear
        forwards;
}


@keyframes obstacleMove {

    from {

        right: -70px;
    }

    to {

        right: 100%;
    }

}


/* =========================================
   PUNKTE
   ========================================= */

#score {

    margin-top: 12px;

    color: #d6336c;

    font-size: 22px;

    font-weight: bold;
}


/* =========================================
   GAME OVER
   ========================================= */

#gameOver {

    display: none;

    position: absolute;

    inset: 0;

    background:
        rgba(
            255,
            240,
            246,
            0.94
        );

    z-index: 20;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    touch-action: auto;
}


#gameOver h2 {

    color: #d6336c;

    font-size: 34px;

    margin: 5px;
}


#gameOver p {

    color: #a61e4d;

    font-size: 20px;

    margin: 5px;
}


/* =========================================
   NEUSTART-BUTTON
   ========================================= */

#restart {

    margin-top: 15px;

    border: none;

    background: #d6336c;

    color: white;

    font-size: 18px;

    font-weight: bold;

    padding:
        12px 25px;

    border-radius: 30px;

    cursor: pointer;

    position: relative;

    z-index: 30;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


#restart:active {

    transform:
        scale(0.95);
}


/* =========================================
   HANDY
   ========================================= */

@media (max-width: 600px) {

    .app {

        position: relative;

        top: -50px;
    }


    .teddy {

        width: 260px;

        margin-bottom: 15px;
    }


    h1 {

        font-size: 25px;

        margin:
            10px 25px 25px;
    }


    .heart img {

        width: 100px;
    }


    #message {

        margin-top: 10px;

        font-size: 24px;

        padding:
            0 20px;
    }


    #startGameButton {

        font-size: 18px;

        padding:
            12px 23px;

        margin-top: 20px;
    }


    #game {

        position: relative;

        top: 0;
    }


    #gameTitle {

        font-size: 25px;

        margin-bottom: 5px;
    }


    #gameText {

        font-size: 15px;

        margin-bottom: 10px;
    }


    #gameArea {

        height: 240px;

        width: 94vw;
    }


    #player {

        left: 40px;

        width: 55px;

        height: 55px;
    }


    .obstacle {

        width: 48px;

        height: 48px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================
         HAUPT-TEDDY
         ===================================== -->

    <img
        src="teddy_sonnenblume.png"
        class="teddy"
        id="mainTeddy"
        alt="Teddy"
    >


    <!-- =====================================
         START-TEXT
         ===================================== -->

    <h1 id="title">

        ich bin dein drück mich teddy,
        wenn justin wieder doof ist.

    </h1>


    <!-- =====================================
         HERZ-BUTTON
         ===================================== -->

    <button
        class="heart"
        id="heartButton"
        onclick="love()"
    >

        <img
            src="herz.png"
            alt="Herz"
        >

    </button>


    <!-- =====================================
         NACHRICHT
         ===================================== -->

    <div id="message"></div>


    <!-- =====================================
         SPIEL STARTEN BUTTON
         ===================================== -->

    <button
        id="startGameButton"
        type="button"
        onclick="startGame()"
    >

        🎮 Spiel starten ❤️

    </button>


    <!-- =====================================
         JUMP-SPIEL
         ===================================== -->

    <div id="game">


        <div id="gameTitle">

            🧸 Kleines Herzchen-Jump 💕

        </div>


        <div id="gameText">

            Spring über die Herzchen!

            <br>

            PC:
            Leertaste / Pfeil hoch

            ·

            Handy:
            Tippen

        </div>


        <div id="gameArea">


            <!-- PIXEL-TEDDY -->

            <img
                src="teddy.png"
                id="player"
                alt="Pixel Teddy"
            >


            <!-- BODEN -->

            <div id="ground"></div>


            <!-- GAME OVER -->

            <div id="gameOver">

                <h2>
                    Oh nein! 💔
                </h2>


                <p>
                    Der Teddy ist gegen
                    ein Herz gelaufen!
                </p>


                <p id="finalScore"></p>


                <button
                    id="restart"
                    type="button"
                >

                    nochmal spielen ❤️

                </button>

            </div>


        </div>


        <div id="score">

            Herzen übersprungen: 0

        </div>


    </div>

</div>



<script>


/* =========================================
   ÜBERRASCHUNGEN
   ========================================= */

const surprises = [

    {
        image:
            "teddy_sonnenblume.png",

        text:
            "denk dran dieser bubi liebt dich, egal wie doof er ist. 💕"
    },


    {
        image:
            "teddy_herz.png",

        text:
            "Justin denkt an dich.❤️"
    },


    {
        image:
            "teddy_liebe.png",

        text:
            "ich liebe diese blauen augen und die wundervolle doofe art❤️"
    },


    {
        image:
            "teddy_kuss.png",

        text:
            "Ich bin so froh, dass es dich gibt ❤️"
    },


    {
        image:
            "teddy_blumen.png",

        text:
            "du bist der trottel den ich braucheee💗"
    },


    {
        image:
            "teddy_rot.png",

        text:
            "Mit dir ist alles schöner 💞"
    },


    {
        image:
            "teddy_herz2.png",

        text:
            "Du bist mein safeplace ❤️"
    },


    {
        image:
            "teddy_liebe2.png",

        text:
            "ich will dich niemals verlieren💕"
    }

];


let surpriseIndex = 0;


/* =========================================
   HERZ WIRD GEDRÜCKT
   ========================================= */

function love() {


    /*
    Titel ausblenden
    */

    document
        .getElementById("title")
        .classList.add("hide");


    /*
    Teddy ändern
    */

    document
        .getElementById("mainTeddy")
        .src =
        surprises[
            surpriseIndex
        ].image;


    /*
    Nachricht anzeigen
    */

    const message =
        document.getElementById(
            "message"
        );


    message.classList.remove(
        "show"
    );


    setTimeout(() => {

        message.innerHTML =
            surprises[
                surpriseIndex
            ].text;

        message.classList.add(
            "show"
        );

    }, 100);


    /*
    Prüfen, ob letzte
    Überraschung erreicht wurde.
    */

    const isLast =
        surpriseIndex ===
        surprises.length - 1;


    /*
    Nächste Überraschung
    */

    surpriseIndex++;


    if (
        surpriseIndex >=
        surprises.length
    ) {

        surpriseIndex = 0;

    }


    /*
    Fliegende Herzen
    */

    createFlyingHearts();


    /*
    WICHTIG:
    Das Spiel startet NICHT automatisch.

    Stattdessen erscheint nach
    der letzten Überraschung
    der Spiel-starten-Button.
    */

    if (isLast) {

        setTimeout(() => {

            document
                .getElementById(
                    "startGameButton"
                )
                .style.display =
                "inline-block";

        }, 700);

    }

}


/* =========================================
   FLIEGENDE HERZEN
   ========================================= */

function createFlyingHearts() {


    for (
        let i = 0;
        i < 12;
        i++
    ) {


        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "floating-heart";


        const img =
            document.createElement(
                "img"
            );


        img.src =
            "herz.png";


        heart.appendChild(img);


        heart.style.left =
            (
                40 +
                Math.random() * 20
            ) + "vw";


        heart.style.top =
            (
                45 +
                Math.random() * 20
            ) + "vh";


        heart.style.setProperty(

            "--moveX",

            (
                Math.random() * 700 -
                350
            ) + "px"

        );


        document
            .body
            .appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 4000);

    }

}


/* =========================================
   JUMP-GAME VARIABLEN
   ========================================= */

let gameRunning = false;

let jumpCount = 0;

let score = 0;

let gameTimer = null;

let collisionTimer = null;


/*
Startgeschwindigkeit
*/

let obstacleSpeed = 2.2;


/* =========================================
   SPIEL STARTEN
   ========================================= */

function startGame() {


    /*
    Spiel-starten-Button verstecken
    */

    document
        .getElementById(
            "startGameButton"
        )
        .style.display =
        "none";


    /*
    Haupt-Teddy verstecken
    */

    document
        .getElementById(
            "mainTeddy"
        )
        .style.display =
        "none";


    /*
    Herz-Button verstecken
    */

    document
        .getElementById(
            "heartButton"
        )
        .style.display =
        "none";


    /*
    Nachricht verstecken
    */

    document
        .getElementById(
            "message"
        )
        .style.display =
        "none";


    /*
    Spiel anzeigen
    */

    document
        .getElementById(
            "game"
        )
        .style.display =
        "block";


    /*
    Werte zurücksetzen
    */

    gameRunning = true;

    score = 0;

    jumpCount = 0;

    obstacleSpeed = 2.2;


    updateScore();


    /*
    Game Over verstecken
    */

    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "none";


    /*
    Alte Herzen löschen
    */

    document
        .querySelectorAll(
            ".obstacle"
        )
        .forEach(
            obstacle =>
                obstacle.remove()
        );


    /*
    Erstes Herz erzeugen
    */

    createObstacle();


    /*
    Kollision prüfen
    */

    collisionTimer =
        setInterval(
            checkCollision,
            30
        );

}


/* =========================================
   DOPPELSPRUNG
   ========================================= */

function jump() {


    if (
        !gameRunning
    ) {

        return;

    }


    /*
    Maximal zwei Sprünge
    */

    if (
        jumpCount >= 2
    ) {

        return;

    }


    jumpCount++;


    const player =
        document.getElementById(
            "player"
        );


    /*
    Animation neu starten
    */

    player.classList.remove(
        "jump"
    );


    void player.offsetWidth;


    player.classList.add(
        "jump"
    );


    /*
    Ersten Sprung beenden
    */

    setTimeout(() => {


        if (
            jumpCount === 1
        ) {

            jumpCount = 0;

        }

    }, 650);


    /*
    Zweiten Sprung beenden
    */

    if (
        jumpCount === 2
    ) {

        setTimeout(() => {

            jumpCount = 0;

        }, 650);

    }

}


/* =========================================
   HERZCHEN ERZEUGEN
   ========================================= */

function createObstacle() {


    if (
        !gameRunning
    ) {

        return;

    }


    const gameArea =
        document.getElementById(
            "gameArea"
        );


    const obstacle =
        document.createElement(
            "img"
        );


    /*
    Dein Pixel-Herz
    */

    obstacle.src =
        "herzspiel.png";


    obstacle.className =
        "obstacle";


    /*
    Geschwindigkeit
    */

    obstacle.style.animationDuration =
        obstacleSpeed + "s";


    gameArea.appendChild(
        obstacle
    );


    /*
    Herz verlässt Spielfeld
    */

    obstacle.addEventListener(
        "animationend",
        () => {


            if (
                obstacle.parentElement
            ) {

                obstacle.remove();


                if (
                    gameRunning
                ) {

                    score++;

                    updateScore();

                }

            }

        }
    );


    /*
    Herzchen werden schneller
    */

    obstacleSpeed -= 0.08;


    /*
    Maximale Geschwindigkeit
    */

    if (
        obstacleSpeed < 0.75
    ) {

        obstacleSpeed = 0.75;

    }


    /*
    Abstand zwischen
    den Herzen
    */

    const nextTime =
        Math.max(
            550,
            1500 -
            score * 25
        );


    gameTimer =
        setTimeout(
            createObstacle,
            nextTime
        );

}


/* =========================================
   KOLLISION
   ========================================= */

function checkCollision() {


    if (
        !gameRunning
    ) {

        return;

    }


    const player =
        document.getElementById(
            "player"
        );


    const playerRect =
        player.getBoundingClientRect();


    const obstacles =
        document.querySelectorAll(
            ".obstacle"
        );


    obstacles.forEach(
        obstacle => {


            const obstacleRect =
                obstacle.getBoundingClientRect();


            const padding = 10;


            const collision =

                playerRect.left +
                padding <
                obstacleRect.right &&

                playerRect.right -
                padding >
                obstacleRect.left &&

                playerRect.top +
                padding <
                obstacleRect.bottom &&

                playerRect.bottom -
                padding >
                obstacleRect.top;


            if (
                collision
            ) {

                gameOver();

            }

        }
    );

}


/* =========================================
   PUNKTE AKTUALISIEREN
   ========================================= */

function updateScore() {


    document
        .getElementById(
            "score"
        )
        .innerHTML =

        "Herzen übersprungen: " +
        score;

}


/* =========================================
   GAME OVER
   ========================================= */

function gameOver() {


    if (
        !gameRunning
    ) {

        return;

    }


    gameRunning = false;


    clearTimeout(
        gameTimer
    );


    clearInterval(
        collisionTimer
    );


    document
        .getElementById(
            "finalScore"
        )
        .innerHTML =

        "Du hast " +
        score +
        " Herzchen geschafft! 💕";


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "flex";

}


/* =========================================
   NEUSTART
   ========================================= */

function restartGame() {


    /*
    Timer stoppen
    */

    clearTimeout(
        gameTimer
    );

    clearInterval(
        collisionTimer
    );


    /*
    Alte Herzen löschen
    */

    document
        .querySelectorAll(
            ".obstacle"
        )
        .forEach(
            obstacle =>
                obstacle.remove()
        );


    /*
    Game Over verstecken
    */

    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "none";


    /*
    Werte zurücksetzen
    */

    score = 0;

    jumpCount = 0;

    obstacleSpeed = 2.2;


    updateScore();


    /*
    Spiel wieder starten
    */

    gameRunning = true;


    createObstacle();


    collisionTimer =
        setInterval(
            checkCollision,
            30
        );

}


/* =========================================
   PC STEUERUNG
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (

            event.code ===
                "Space"

            ||

            event.code ===
                "ArrowUp"

        ) {


            event.preventDefault();


            jump();

        }

    }
);


/* =========================================
   HANDY STEUERUNG
   ========================================= */

document
    .getElementById(
        "gameArea"
    )
    .addEventListener(
        "touchstart",
        function(event) {


            /*
            Neustart-Button ignorieren
            */

            if (
                event.target.closest(
                    "#restart"
                )
            ) {

                return;

            }


            event.preventDefault();


            jump();

        },
        {
            passive: false
        }
    );


/* =========================================
   HANDY NEUSTART-BUTTON
   ========================================= */

document
    .getElementById(
        "restart"
    )
    .addEventListener(
        "touchend",
        function(event) {


            event.preventDefault();

            event.stopPropagation();


            restartGame();

        },
        {
            passive: false
        }
    );


/* =========================================
   PC / MAUS NEUSTART
   ========================================= */

document
    .getElementById(
        "restart"
    )
    .addEventListener(
        "click",
        function(event) {


            /*
            Bei Touch-Geräten übernimmt
            touchend den Neustart.
            */

            if (
                "ontouchstart" in window
            ) {

                return;

            }


            restartGame();

        }
    );


/* =========================================
   MAUS STEUERUNG
   ========================================= */

document
    .getElementById(
        "gameArea"
    )
    .addEventListener(
        "mousedown",
        function(event) {


            /*
            Nicht springen,
            wenn Button angeklickt wurde.
            */

            if (
                event.target.closest(
                    "#restart"
                )
            ) {

                return;

            }


            jump();

        }
    );

</script>


</body>

</html>
