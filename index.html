<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>svenja ❤️</title>


<style>

/* =====================================================
   GRUNDLAYOUT
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #fff0f6
        );

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =====================================================
   APP
   ===================================================== */

.app {

    width: 100%;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 15px;
}


/* =====================================================
   STARTSEITE
   ===================================================== */

#home {

    width: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


/* =====================================================
   TEDDY
   ===================================================== */

#mainTeddy {

    width: 300px;

    max-width: 75vw;

    display: block;

    margin:
        0 auto 15px;

    border-radius: 25px;
}


/* =====================================================
   TITEL
   ===================================================== */

#title {

    color: #d6336c;

    font-size: 32px;

    line-height: 1.25;

    max-width: 700px;

    margin:
        5px auto 20px;

    transition:
        opacity 0.5s ease,
        max-height 0.5s ease,
        margin 0.5s ease;

    max-height: 150px;
}


#title.hide {

    opacity: 0;

    max-height: 0;

    margin:
        0 auto;

    overflow: hidden;
}


/* =====================================================
   HERZ BUTTON
   ===================================================== */

#heartButton {

    display: block;

    width: 140px;

    height: 140px;

    margin:
        0 auto;

    padding: 10px;

    border: none;

    outline: none;

    background: transparent;

    cursor: pointer;

    position: relative;

    z-index: 999999;

    pointer-events: auto;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    user-select: none;
}


#heartButton img {

    width: 120px;

    height: 120px;

    display: block;

    margin: auto;

    object-fit: contain;

    pointer-events: none;

    user-select: none;

    transition:
        transform 0.15s ease;
}


#heartButton:active img {

    transform:
        scale(1.35);
}


/* =====================================================
   NACHRICHT
   ===================================================== */

#message {

    width: 100%;

    max-width: 800px;

    padding:
        0 20px;

    margin-top: 10px;

    color: #d6336c;

    font-size: 28px;

    font-weight: bold;

    line-height: 1.3;

    opacity: 0;

    transform:
        scale(0.7);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}


#message.show {

    opacity: 1;

    transform:
        scale(1);
}


/* =====================================================
   SPIEL START BUTTON
   ===================================================== */

#startGameButton {

    display: none;

    margin:
        18px auto 0;

    padding:
        15px 30px;

    border: none;

    outline: none;

    border-radius: 30px;

    background: #d6336c;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    position: relative;

    z-index: 999999;

    pointer-events: auto;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    box-shadow:
        0 5px 15px
        rgba(
            214,
            51,
            108,
            0.25
        );
}


#startGameButton:active {

    transform:
        scale(0.95);
}


/* =====================================================
   FLIEGENDE HERZEN
   ===================================================== */

@keyframes fly {

    from {

        transform:
            translate(
                0,
                0
            )
            scale(0.5);

        opacity: 1;
    }

    to {

        transform:
            translate(
                var(--moveX),
                -100vh
            )
            scale(1);

        opacity: 0;
    }
}


.floating-heart {

    position: fixed;

    width: 22px;

    height: 22px;

    left: 50%;

    bottom: 30%;

    pointer-events: none;

    z-index: 1000;

    animation:
        fly 4s linear forwards;
}


.floating-heart img {

    width: 100%;

    height: 100%;

    display: block;

    pointer-events: none;
}


/* =====================================================
   SPIEL
   ===================================================== */

#game {

    display: none;

    width: 100%;

    height: 100%;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


#gameTitle {

    color: #d6336c;

    font-size: 30px;

    font-weight: bold;

    margin-bottom: 5px;
}


#gameText {

    color: #a61e4d;

    font-size: 16px;

    line-height: 1.4;

    margin-bottom: 10px;
}


/* =====================================================
   SPIELFELD
   ===================================================== */

#gameArea {

    position: relative;

    width:
        min(900px, 94vw);

    height: 300px;

    overflow: hidden;

    border:
        4px solid #d6336c;

    border-radius: 20px;

    background-image:
        url("hintergrund.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    box-shadow:
        0 8px 25px
        rgba(
            214,
            51,
            108,
            0.25
        );
}


/* =====================================================
   BODEN
   ===================================================== */

#ground {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 8px;

    background: #d6336c;

    z-index: 2;
}


/* =====================================================
   PIXEL TEDDY
   ===================================================== */

#player {

    position: absolute;

    left: 70px;

    bottom: 8px;

    width: 65px;

    height: 65px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 5;

    pointer-events: none;

    user-select: none;
}


/* =====================================================
   SPRUNG
   ===================================================== */

#player.jump {

    animation:
        jumpAnimation
        0.65s
        ease-out;
}


@keyframes jumpAnimation {

    0% {

        bottom: 8px;
    }

    50% {

        bottom: 155px;
    }

    100% {

        bottom: 8px;
    }
}


/* =====================================================
   HERZ-HINDERNISSE
   ===================================================== */

.obstacle {

    position: absolute;

    right: -70px;

    bottom: 8px;

    width: 55px;

    height: 55px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 4;

    pointer-events: none;

    animation:
        obstacleMove
        2.2s
        linear
        forwards;
}


@keyframes obstacleMove {

    from {

        right: -70px;
    }

    to {

        right: 100%;
    }
}


/* =====================================================
   SPRUNG BUTTON
   ===================================================== */

#jumpButton {

    display: block;

    width:
        min(320px, 80vw);

    margin:
        10px auto 0;

    padding:
        15px 25px;

    border: none;

    outline: none;

    border-radius: 30px;

    background: #d6336c;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    user-select: none;

    box-shadow:
        0 5px 15px
        rgba(
            214,
            51,
            108,
            0.25
        );
}


#jumpButton:active {

    transform:
        scale(0.94);
}


/* =====================================================
   SCORE
   ===================================================== */

#score {

    margin-top: 8px;

    color: #d6336c;

    font-size: 20px;

    font-weight: bold;
}


/* =====================================================
   GAME OVER
   ===================================================== */

#gameOver {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 100;

    background:
        rgba(
            255,
            240,
            246,
            0.96
        );

    justify-content: center;

    align-items: center;

    flex-direction: column;
}


#gameOver h2 {

    color: #d6336c;

    font-size: 32px;

    margin:
        5px 0;
}


#gameOver p {

    color: #a61e4d;

    font-size: 18px;

    margin:
        5px 15px;
}


/* =====================================================
   NOCHMAL SPIELEN
   ===================================================== */

#restart {

    margin-top: 15px;

    padding:
        14px 27px;

    border: none;

    outline: none;

    border-radius: 30px;

    background: #d6336c;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    position: relative;

    z-index: 999999;

    pointer-events: auto;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


#restart:active {

    transform:
        scale(0.95);
}


/* =====================================================
   HANDY
   ===================================================== */

@media (max-width: 600px) {


    .app {

        padding:
            8px;
    }


    #mainTeddy {

        width: 220px;

        margin-bottom: 5px;
    }


    #title {

        font-size: 23px;

        margin:
            3px 15px 8px;
    }


    #heartButton {

        width: 125px;

        height: 125px;

        padding: 5px;
    }


    #heartButton img {

        width: 105px;

        height: 105px;
    }


    #message {

        font-size: 21px;

        margin-top: 5px;
    }


    #startGameButton {

        font-size: 18px;

        padding:
            13px 25px;

        margin-top: 10px;
    }


    #gameTitle {

        font-size: 23px;
    }


    #gameText {

        font-size: 13px;

        margin-bottom: 7px;
    }


    #gameArea {

        width: 94vw;

        height: 225px;
    }


    #player {

        left: 30px;

        width: 55px;

        height: 55px;
    }


    .obstacle {

        width: 48px;

        height: 48px;
    }


    #jumpButton {

        width: 80vw;

        min-height: 55px;

        font-size: 21px;

        margin-top: 8px;
    }


    #score {

        font-size: 17px;

        margin-top: 5px;
    }


    #gameOver h2 {

        font-size: 28px;
    }


    #gameOver p {

        font-size: 16px;
    }


    #restart {

        min-height: 50px;

        font-size: 17px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     STARTSEITE
     ===================================================== -->

<div id="home">


    <img
        src="teddy_sonnenblume.png"
        id="mainTeddy"
        alt="Teddy"
    >


    <h1 id="title">

        ich bin dein drück mich teddy,
        wenn justin wieder doof ist.

    </h1>


    <!--
    WICHTIG:

    Der Klick wird direkt mit
    onclick="love()" ausgelöst.
    -->


    <button
        id="heartButton"
        type="button"
        onclick="love()"
        aria-label="Nächste Überraschung"
    >

        <img
            src="herz.png"
            alt="Herz"
        >

    </button>


    <div id="message"></div>


    <button
        id="startGameButton"
        type="button"
        onclick="startGame()"
    >

        🎮 Spiel starten ❤️

    </button>


</div>



<!-- =====================================================
     SPIEL
     ===================================================== -->

<div id="game">


    <div id="gameTitle">

        🧸 Kleines Herzchen-Jump 💕

    </div>


    <div id="gameText">

        Springe über die Herzchen!

        <br>

        Handy: SPRINGEN-Taste
        ·
        PC: Leertaste / Pfeil hoch

    </div>


    <div id="gameArea">


        <img
            src="teddy.png"
            id="player"
            alt="Pixel Teddy"
        >


        <div id="ground"></div>


        <!-- GAME OVER -->

        <div id="gameOver">


            <h2>

                Oh nein! 💔

            </h2>


            <p>

                Der Teddy ist gegen
                ein Herz gelaufen!

            </p>


            <p id="finalScore"></p>


            <button
                id="restart"
                type="button"
                onclick="restartGame(event)"
            >

                nochmal spielen ❤️

            </button>


        </div>


    </div>


    <!--
    NUR DIESE TASTE STEUERT
    DEN SPRUNG.
    -->


    <button
        id="jumpButton"
        type="button"
        onclick="jump()"
    >

        🧸 SPRINGEN ❤️

    </button>


    <div id="score">

        Herzen übersprungen: 0

    </div>


</div>


</div>



<script>

/* =====================================================
   ÜBERRASCHUNGEN
   ===================================================== */

const surprises = [

    {
        image:
            "teddy_sonnenblume.png",

        text:
            "denk dran dieser bubi liebt dich, egal wie doof er ist. 💕"
    },


    {
        image:
            "teddy_herz.png",

        text:
            "Justin denkt an dich.❤️"
    },


    {
        image:
            "teddy_liebe.png",

        text:
            "ich liebe diese blauen augen und die wundervolle doofe art❤️"
    },


    {
        image:
            "teddy_kuss.png",

        text:
            "Ich bin so froh, dass es dich gibt ❤️"
    },


    {
        image:
            "teddy_blumen.png",

        text:
            "du bist der trottel den ich braucheee💗"
    },


    {
        image:
            "teddy_rot.png",

        text:
            "Mit dir ist alles schöner 💞"
    },


    {
        image:
            "teddy_herz2.png",

        text:
            "Du bist mein safeplace ❤️"
    },


    {
        image:
            "teddy_liebe2.png",

        text:
            "ich will dich niemals verlieren💕"
    }

];


/* =====================================================
   ÜBERRASCHUNGS-ZÄHLER
   ===================================================== */

let surpriseIndex = 0;


/* =====================================================
   LOVE FUNKTION
   ===================================================== */

function love() {


    /*
    Aktuelle Überraschung holen.
    */

    const surprise =
        surprises[
            surpriseIndex
        ];


    /*
    Titel beim ersten Klick
    verschwinden lassen.
    */

    if (
        surpriseIndex === 0
    ) {

        document
            .getElementById("title")
            .classList.add("hide");

    }


    /*
    TEDDY WECHSELN
    */

    document
        .getElementById("mainTeddy")
        .src =
        surprise.image;


    /*
    NACHRICHT
    */

    const message =
        document
            .getElementById("message");


    message.classList.remove(
        "show"
    );


    setTimeout(
        function() {

            message.textContent =
                surprise.text;

            message.classList.add(
                "show"
            );

        },
        100
    );


    /*
    FLIEGENDE HERZEN
    */

    createFlyingHearts();


    /*
    ZUM NÄCHSTEN EINTRAG
    */

    surpriseIndex++;


    /*
    Wenn alle 8 Überraschungen
    gezeigt wurden:

    Spielbutton anzeigen.

    WICHTIG:
    Der Herzbutton wird NICHT
    deaktiviert.
    */

    if (
        surpriseIndex >=
        surprises.length
    ) {

        document
            .getElementById(
                "startGameButton"
            )
            .style.display =
            "block";

        /*
        Danach wieder von vorne.
        Das Herz bleibt dadurch
        immer benutzbar.
        */

        surpriseIndex = 0;

    }

}


/* =====================================================
   FLIEGENDE HERZEN
   ===================================================== */

function createFlyingHearts() {


    for (
        let i = 0;
        i < 12;
        i++
    ) {


        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "floating-heart";


        const image =
            document.createElement(
                "img"
            );


        image.src =
            "herz.png";


        heart.appendChild(
            image
        );


        heart.style.left =
            (
                35 +
                Math.random() * 30
            ) + "vw";


        heart.style.setProperty(
            "--moveX",
            (
                Math.random() * 500 -
                250
            ) + "px"
        );


        document.body.appendChild(
            heart
        );


        setTimeout(
            function() {

                heart.remove();

            },
            4000
        );

    }

}


/* =====================================================
   SPIEL-VARIABLEN
   ===================================================== */

let gameRunning =
    false;

let jumpCount =
    0;

let score =
    0;

let obstacleSpeed =
    2.2;

let obstacleTimer =
    null;

let collisionTimer =
    null;


/* =====================================================
   SPIEL START
   ===================================================== */

function startGame() {


    /*
    Startseite verstecken.
    */

    document
        .getElementById("home")
        .style.display =
        "none";


    /*
    Spiel anzeigen.
    */

    document
        .getElementById("game")
        .style.display =
        "flex";


    /*
    Neues Spiel.
    */

    startNewGame();

}


/* =====================================================
   NEUES SPIEL
   ===================================================== */

function startNewGame() {


    /*
    Alte Timer stoppen.
    */

    clearTimeout(
        obstacleTimer
    );

    clearInterval(
        collisionTimer
    );


    /*
    Alte Hindernisse löschen.
    */

    document
        .querySelectorAll(
            ".obstacle"
        )
        .forEach(
            function(obstacle) {

                obstacle.remove();

            }
        );


    /*
    Werte zurücksetzen.
    */

    gameRunning =
        true;

    jumpCount =
        0;

    score =
        0;

    obstacleSpeed =
        2.2;


    /*
    Game Over ausblenden.
    */

    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "none";


    /*
    Teddy zurücksetzen.
    */

    document
        .getElementById(
            "player"
        )
        .classList.remove(
            "jump"
        );


    /*
    Punktestand.
    */

    updateScore();


    /*
    Erstes Herz.
    */

    createObstacle();


    /*
    Kollision prüfen.
    */

    collisionTimer =
        setInterval(
            checkCollision,
            30
        );

}


/* =====================================================
   SPRINGEN
   ===================================================== */

function jump() {


    if (
        !gameRunning
    ) {

        return;

    }


    /*
    Maximal zwei Sprünge
    gleichzeitig.
    */

    if (
        jumpCount >= 2
    ) {

        return;

    }


    jumpCount++;


    const player =
        document.getElementById(
            "player"
        );


    /*
    Animation neu starten.
    */

    player.classList.remove(
        "jump"
    );


    void player.offsetWidth;


    player.classList.add(
        "jump"
    );


    /*
    Nach dem Sprung
    wieder freigeben.

    Dadurch ist ein neuer
    Doppelsprung möglich.
    */

    setTimeout(
        function() {

            jumpCount = 0;

            player.classList.remove(
                "jump"
            );

        },
        650
    );

}


/* =====================================================
   PC STEUERUNG
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            !gameRunning
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
            ||
            event.code ===
            "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/* =====================================================
   HERZ HINDERNIS
   ===================================================== */

function createObstacle() {


    if (
        !gameRunning
    ) {

        return;

    }


    const obstacle =
        document.createElement(
            "img"
        );


    obstacle.src =
        "herzspiel.png";


    obstacle.className =
        "obstacle";


    obstacle.style.animationDuration =
        obstacleSpeed + "s";


    document
        .getElementById(
            "gameArea"
        )
        .appendChild(
            obstacle
        );


    /*
    Wenn das Herz rechts
    raus ist -> Punkt.
    */

    obstacle.addEventListener(
        "animationend",
        function() {


            if (
                obstacle.parentElement
            ) {

                obstacle.remove();


                if (
                    gameRunning
                ) {

                    score++;

                    updateScore();

                }

            }

        }
    );


    /*
    Immer schneller.
    */

    obstacleSpeed -= 0.08;


    if (
        obstacleSpeed < 0.75
    ) {

        obstacleSpeed =
            0.75;

    }


    /*
    Abstand wird kleiner.
    */

    const nextTime =
        Math.max(
            550,
            1500 -
            score * 25
        );


    obstacleTimer =
        setTimeout(
            createObstacle,
            nextTime
        );

}


/* =====================================================
   KOLLISION
   ===================================================== */

function checkCollision() {


    if (
        !gameRunning
    ) {

        return;

    }


    const player =
        document.getElementById(
            "player"
        );


    const playerRect =
        player.getBoundingClientRect();


    const obstacles =
        document.querySelectorAll(
            ".obstacle"
        );


    obstacles.forEach(
        function(obstacle) {


            const obstacleRect =
                obstacle.getBoundingClientRect();


            const padding =
                10;


            const collision =

                playerRect.left +
                padding <
                obstacleRect.right

                &&

                playerRect.right -
                padding >
                obstacleRect.left

                &&

                playerRect.top +
                padding <
                obstacleRect.bottom

                &&

                playerRect.bottom -
                padding >
                obstacleRect.top;


            if (
                collision
            ) {

                endGame();

            }

        }
    );

}


/* =====================================================
   SCORE
   ===================================================== */

function updateScore() {


    document
        .getElementById(
            "score"
        )
        .textContent =

        "Herzen übersprungen: " +
        score;

}


/* =====================================================
   GAME OVER
   ===================================================== */

function endGame() {


    if (
        !gameRunning
    ) {

        return;

    }


    gameRunning =
        false;


    clearTimeout(
        obstacleTimer
    );

    clearInterval(
        collisionTimer
    );


    document
        .getElementById(
            "finalScore"
        )
        .textContent =

        "Du hast " +
        score +
        " Herzchen geschafft! 💕";


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "flex";

}


/* =====================================================
   NOCHMAL SPIELEN
   ===================================================== */

function restartGame(event) {


    /*
    Wichtig für Handy:

    Verhindert, dass der Klick
    irgendwo weitergegeben wird.
    */

    if (
        event
    ) {

        event.preventDefault();

        event.stopPropagation();

    }


    /*
    Einfach ein komplett neues
    Spiel starten.
    */

    startNewGame();

}

</script>


</body>
