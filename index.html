<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>svenja</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #fff0f6
    );
}

.app {
    text-align: center;
    width: 100%;
}

.teddy {
    width: 300px;
    max-width: 80vw;

    border-radius: 25px;

    display: block;

    margin: 0 auto 20px;
}


/* Überschrift am Anfang */

h1 {
    color: #d6336c;

    font-size: 32px;

    margin: 10px 0 30px;

    transition:
        opacity 0.5s ease,
        height 0.5s ease,
        margin 0.5s ease;
}


/* Überschrift verschwindet beim ersten Klick */

h1.hide {
    opacity: 0;

    height: 0;

    margin: 0;

    overflow: hidden;
}


/* Klick-Herz */

.heart {
    border: none;

    background: transparent;

    font-size: 120px;

    cursor: pointer;

    transition: transform 0.2s;

    padding: 0;
}

.heart img {
    width: 120px;

    height: auto;

    display: block;

    transition:
        transform 0.3s ease;
}

.heart:active img {
    transform: scale(1.5);
}


/* Herz-Pop Animation */

@keyframes heartpop {

    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.6);
    }

    55% {
        transform: scale(1.25);
    }

    75% {
        transform: scale(1.5);
    }

    100% {
        transform: scale(1);
    }

}


/* Nachricht */

#message {

    margin-top: 25px;

    font-size: 30px;

    font-weight: bold;

    color: #d6336c;

    opacity: 0;

    transform: scale(0.5);

    transition: 0.5s;

    padding: 0 20px;
}

#message.show {

    opacity: 1;

    transform: scale(1);
}


/* Fliegende Herzen */

@keyframes fly {

    from {

        top: 55%;

        opacity: 1;

        transform:
            translateX(0)
            scale(0.5);
    }

    to {

        top: -20%;

        opacity: 0;

        transform:
            translateX(var(--moveX))
            scale(1);
    }

}

.floating-heart {

    position: fixed;

    left: 50%;

    top: 55%;

    width: 20px;

    height: 20px;

    animation:
        fly 4s linear forwards;

    pointer-events: none;
}

.floating-heart img {

    width: 20px;

    height: 20px;

    display: block;
}


/* =========================================
   HANDY
   ========================================= */

@media (max-width: 600px) {

    .app {

        position: relative;

        top: -80px;
    }


    .teddy {

        width: 260px;

        margin-bottom: 15px;
    }


    h1 {

        font-size: 25px;

        margin:
            10px 25px 25px;
    }


    .heart {

        margin: 0;

        padding: 0;
    }


    .heart img {

        width: 100px;
    }


    #message {

        margin-top: 10px;

        font-size: 24px;

        padding:
            0 20px;
    }

}


/* =========================================
   BILDER + TEXTE
   ========================================= */

</style>

</head>


<body>


<div class="app">


    <!-- TEDDY -->

    <img
        src="teddy_sonnenblume.png"
        class="teddy"
        alt="Teddy"
    >


    <!-- TEXT AM ANFANG -->

    <h1 id="title">

        ich bin dein drück mich teddy,
        wenn justin wieder doof ist.

    </h1>


    <!-- KLICK-HERZ -->

    <button
        class="heart"
        onclick="love()"
    >

        <img
            src="herz.png"
            alt="Herz"
        >

    </button>


    <!-- NACHRICHT NACH DEM KLICK -->

    <div id="message">

    </div>


</div>


<script>


/*
=================================================
BILDER + TEXTE
=================================================

Hier kannst du jederzeit neue Bilder
und Texte hinzufügen.

Das Bild muss genau so heißen wie die
PNG-Datei in deinem GitHub-Ordner.
*/


const surprises = [


    {
        image: "teddy_sonnenblume.png",

        text:
        "denk dran dieser bubi liebt dich, egal wie doof er ist. 💕"
    },


    {
        image: "teddy_herz.png",

        text:
        "Justin denkt an dich.❤️"
    },


    {
        image: "teddy_liebe.png",

        text:
        "ich liebe diese blauen augen und die wundervolle doofe art❤️"
    },


    {
        image: "teddy_kuss.png",

        text:
        "Ich bin so froh, dass es dich gibt ❤️"
    },


    {
        image: "teddy_blumen.png",

        text:
        "du bist der trottel den ich braucheee💗"
    },


    {
        image: "teddy_rot.png",

        text:
        "Mit dir ist alles schöner 💞"
    },


    {
        image: "teddy_herz2.png",

        text:
        "Du bist mein safeplace ❤️"
    },


    {
        image: "teddy_liebe2.png",

        text:
        "ich will dich niemals verlieren💕"
    }


];


let surpriseIndex = 0;


/*
=================================================
HERZ WIRD GEDRÜCKT
=================================================
*/

function love() {


    /*
    ---------------------------------------------
    "Für dich"-Text verschwinden
    ---------------------------------------------
    */

    document
        .getElementById("title")
        .classList.add("hide");


    /*
    ---------------------------------------------
    TEDDY-BILD ÄNDERN
    ---------------------------------------------
    */

    document
        .querySelector(".teddy")
        .src =
        surprises[surpriseIndex].image;


    /*
    ---------------------------------------------
    NACHRICHT ÄNDERN
    ---------------------------------------------
    */

    const message =
        document.getElementById("message");


    message.classList.remove("show");


    setTimeout(() => {


        message.innerHTML =
            surprises[surpriseIndex].text;


        message.classList.add("show");


    }, 100);


    /*
    ---------------------------------------------
    NÄCHSTES BILD + NÄCHSTER TEXT
    ---------------------------------------------
    */

    surpriseIndex++;


    if (
        surpriseIndex >=
        surprises.length
    ) {

        surpriseIndex = 0;

    }


    /*
    =============================================
    FLIEGENDE HERZEN
    =============================================
    */

    for (
        let i = 0;
        i < 12;
        i++
    ) {


        const heart =
            document.createElement("div");


        heart.className =
            "floating-heart";


        const img =
            document.createElement("img");


        img.src =
            "herz.png";


        heart.appendChild(img);


        /*
        Zufällige Startposition
        */

        heart.style.left =
            (
                40 +
                Math.random() * 20
            ) + "vw";


        heart.style.top =
            (
                45 +
                Math.random() * 20
            ) + "vh";


        /*
        Zufällige Bewegung
        */

        heart.style.setProperty(

            "--moveX",

            (
                Math.random() * 700 -
                350
            ) + "px"

        );


        /*
        Herz anzeigen
        */

        document
            .body
            .appendChild(heart);


        /*
        Herz wieder löschen
        */

        setTimeout(() => {

            heart.remove();

        }, 2000);


    }

}


</script>


</body>
</html>
